name: Build and Push Docker Image

on:
  push:
    branches:
      - main
      - dev

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker pull ghcr.io/${{ github.repository }}:${{ github.ref_name }} || true
          docker build \
            --cache-from ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --build-arg BUILD_SHA=${{ github.sha }} \
            --build-arg BUILD_TIMESTAMP=${{ github.event.head_commit.timestamp }} \
            --tag ghcr.io/${{ github.repository }}:${{ github.ref_name }} \
            --tag ghcr.io/${{ github.repository }}:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository }}:${{ github.ref_name }}
          docker push ghcr.io/${{ github.repository }}:${{ github.sha }}

      - name: Install jq
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Load public dev Watch configuration
        id: watch
        run: |
          python3 - <<'PY'
          import json, os
          config = {}
          is_dev = os.environ['GITHUB_REF_NAME'] == 'dev'
          if is_dev:
              with open('docs/watch-authentik-dev.json') as source:
                  config = json.load(source)
          values = {
              'issuer': config.get('WATCH_OIDC_ISSUER', ''),
              'client_id': config.get('WATCH_OIDC_CLIENT_ID', ''),
              'jwks': config.get('WATCH_OIDC_JWKS_URL', ''),
              'push_enabled': 'true' if is_dev else 'false',
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              for key, value in values.items():
                  assert '\n' not in value and '\r' not in value
                  print(f'{key}={value}', file=output)
          PY

      - name: Deploy to Portainer
        uses: bignellrp/portainer-api-action@main
        with:
          portainer_url: ${{ vars.PORTAINER_URL }}
          portainer_api_key: ${{ secrets.PORTAINER_TOKEN }}
          stack_name: ${{ github.ref_name == 'main' && github.event.repository.name || format('{0}-dev', github.event.repository.name) }}
          stack_file: docker-compose.yml
          endpoint_id: 2
          action: redeploy
          prune: true
          env_vars: |
            {"BRANCH":"${{ github.ref_name }}","PORT":"${{ github.ref_name == 'main' && vars.PORTAINER_PORT_MAIN || vars.PORTAINER_PORT_DEV }}","IMAGE_TAG":"${{ github.sha }}","WATCH_OIDC_ISSUER":"${{ steps.watch.outputs.issuer }}","WATCH_OIDC_CLIENT_ID":"${{ steps.watch.outputs.client_id }}","WATCH_OIDC_JWKS_URL":"${{ steps.watch.outputs.jwks }}","WATCH_PUSH_ENABLED":"${{ steps.watch.outputs.push_enabled }}"}
