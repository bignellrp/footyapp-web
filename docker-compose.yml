version: '3.8'

services:
  footyapp-web:
    image: ghcr.io/bignellrp/footyapp-web:${IMAGE_TAG}
    container_name: footyapp-web-${BRANCH}
    networks:
      - br1
    ports:
      - "2${PORT}:80"
    restart: always
    env_file:
      - /mnt/docker/footyapp-web-${BRANCH}/.env
    environment:
      - TZ=Europe/London
      - WATCH_PUSH_JOURNAL=/app/watch-data/submissions.sqlite3
      - WATCH_OIDC_ISSUER=${WATCH_OIDC_ISSUER:-}
      - WATCH_OIDC_CLIENT_ID=${WATCH_OIDC_CLIENT_ID:-}
      - WATCH_OIDC_JWKS_URL=${WATCH_OIDC_JWKS_URL:-}
      - WATCH_PUSH_ENABLED=${WATCH_PUSH_ENABLED:-false}
    volumes:
      - /mnt/docker/footyapp-web-${BRANCH}/watch-data:/app/watch-data

networks:
  br1:
    external: true
    name: br1
